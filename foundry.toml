[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./contracts/deployments" }]

[profile.default.fuzz]
runs = 256

[invariant]
runs = 64
depth = 10
fail_on_revert = false

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech/terigon"
xlayer = "https://rpc.xlayer.tech"
